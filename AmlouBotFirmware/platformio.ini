; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
; board = esp32dev
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
build_flags =-DARDUINO_USB_CDC_ON_BOOT=1
    ; -DARDUINO_USB_MODE=1

lib_deps = ESP32Async/AsyncTCP
          adafruit/Adafruit NeoPixel@^1.15.5
          adafruit/Adafruit BMP280 Library@^3.0.0
          adafruit/Adafruit AHTX0@^2.0.6
          adafruit/Adafruit INA219@^1.2.3
          adafruit/Adafruit BNO055@^1.6.4
          adafruit/Adafruit LTR390 Library@^1.1.2
          pololu/VL53L1X@^1.3.1
          mikalhart/TinyGPSPlus@^1.1.0
          ; madhephaestus/ESP32Servo@^3.2.1 // idk why have problems with esp32 s3
